name: astrbot_plugin_hltv_news
display_name: HLTV 新闻播报
desc: |
  定时轮询 HLTV.org 官方 RSS，抓取最新新闻并推送到指定群聊。

  - 每隔可配置的间隔轮询一次 HLTV RSS
  - 抓取先前未推送过的最新新闻（按稳定 ID 去重，最多一次推 3 条）
  - 用 LLM 先概括后翻译：中文标题 + ≤50 字中文概括，保留选手 ID / 队名 / 人名不翻译
  - 推送格式：头图 + 标题 + 发布时间 + 概括 + 原文链接（QQ 群友好排版）
  - LLM 不可用时直接报错停用，绝不污染主对话上下文
short_desc: HLTV（CS2 电竞）新闻定时播报。
author: Trantormann
version: 1.0.4
repo: https://github.com/Trantormann/astrbot_plugin_hltv_news
